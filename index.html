<!DOCTYPE html>
<html lang="lb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>P3 Zuelen 20–99 – 3 Spiller</title>

  <style>
    @font-face {
      font-family: 'Schoulschrëft';
      src: url('https://raw.githubusercontent.com/albrechtclaire1007/schoulschreft/main/schoulschreft_bold%5B2%5D.TTF') format('truetype');
      font-weight: bold;
      font-display: swap;
    }

    :root{
      /* ===== P3 MASTER VISUALS ===== */
      --bg1:#E7F5FF;
      --bg2:#CFEAFF;

      --bar:#6FAFE6;
      --barBorder:#4D90CD;

      --ink:#1f1f1f;
      --white:#fff;

      --border:3px;
      --shadow:0 10px 24px rgba(0,0,0,.08);
      --pad:clamp(10px,2.2vw,16px);
      --r:18px;

      --iconArrow:"https://i.postimg.cc/QBYTSN08/p3arrow.png";

      /* keep game colours */
      --accent:#2b7de9;
      --accent-ink:#0c3c91;
      --ring:#d7e6ff;
      --ok:#2e7d32;
      --bad:#c62828;
      --tileHover:#f6f8fb;
      --soft-red:#e53935;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body{
      margin:0;
      background:linear-gradient(135deg,var(--bg2),var(--bg1));
      color:var(--ink);
      font-family:'Schoulschrëft', system-ui, Arial, sans-serif;
      min-height:100svh;
    }

    /* ===== TOP BAR (NO play/replay) ===== */
    .topbar{
      position:sticky; top:10px; z-index:10;
      width:min(1200px,96vw);
      margin:10px auto 0;
      background:var(--bar);
      border:var(--border) solid var(--barBorder);
      border-radius:999px;
      box-shadow:var(--shadow);
      padding:10px 12px;

      display:grid;
      grid-template-columns: 1fr auto;
      align-items:center;
      gap:10px;
    }

    .badge{
      justify-self:start;
      font-size:clamp(1rem,2.2vw,1.15rem);
      padding:8px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.92);
      border:var(--border) solid rgba(255,255,255,.65);
      color:var(--accent-ink);
      box-shadow:0 6px 16px rgba(0,0,0,.08);
      white-space:nowrap;
    }

    .btn{
      font-family:'Schoulschrëft', system-ui, Arial, sans-serif;
      border:var(--border) solid rgba(255,255,255,.65);
      border-radius:14px;
      padding:10px 14px;
      background:rgba(255,255,255,.92);
      color:var(--accent-ink);
      cursor:pointer;
      font-weight:800;
      box-shadow:0 6px 16px rgba(0,0,0,.08);
    }
    .btn:active{ transform:scale(.98); }
    .btn:hover{ background:#fff; }

    /* ===== LAYOUT WRAPPER ===== */
    .app{
      width:min(1200px,96vw);
      margin:18px auto 26px;
      padding:var(--pad);
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .card{
      background:rgba(255,255,255,.8);
      border:var(--border) solid rgba(255,255,255,.65);
      border-radius:var(--r);
      box-shadow:var(--shadow);
      padding:clamp(12px,2.2vw,18px);
    }

    /* ===== Center navigation with image arrows ===== */
    .nav-wrap{
      display:grid;
      grid-template-columns: 64px 1fr 64px;
      align-items:center;
      gap:10px;
      width:min(1100px,100%);
      margin:0 auto;
    }

    .nav-arrow{
      width:54px; height:54px;
      border:none;
      background:transparent;
      cursor:pointer;
      display:grid;
      place-items:center;
      justify-self:center;
    }
    .nav-arrow:active{ transform:scale(.98); }
    .nav-arrow img{ width:46px; height:46px; object-fit:contain; }
    #prevArrow img{ transform:rotate(180deg); }

    .nav{
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .tab{
      border:var(--border) solid rgba(0,0,0,.18);
      border-radius:999px;
      background:rgba(255,255,255,.92);
      padding:10px 16px;
      cursor:pointer;
      user-select:none;
      font-weight:900;
      font-size:clamp(1.05rem,2.2vw,1.25rem);
      box-shadow:0 6px 16px rgba(0,0,0,.06);
    }
    .tab.active{
      background:#fff;
      outline:3px solid rgba(0,0,0,.18);
    }

    .screen{ display:none; }
    .screen.active{ display:block; }

    .word{
      text-align:center;
      font-size: clamp(26px, 4.2vw, 44px);
      font-weight:700;
      margin:6px 0 12px;
      padding:12px 16px;
      border-radius:16px;
      background:rgba(255,255,255,.92);
      border:var(--border) solid rgba(0,0,0,.12);
      color:var(--accent-ink);
      box-shadow:0 6px 16px rgba(0,0,0,.06);
    }
    .word .red{ color: var(--soft-red); }

    .row{ margin:16px 0 6px; }
    .label{ color:rgba(0,0,0,.55); font-size:clamp(1rem,2.2vw,1.1rem); margin:0 0 8px 6px; }

    .choices{ display:grid; gap:12px; }
    .choices.units{ grid-template-columns: repeat(10, minmax(52px, 1fr)); }
    .choices.tens{ grid-template-columns: repeat(9, minmax(68px, 1fr)); }

    .chip{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
      cursor:pointer;
      font-weight:900;
      color:var(--ink);
      border:var(--border) solid rgba(0,0,0,.22);
      background:rgba(255,255,255,.92);
      transition:transform .06s ease, background .15s ease, color .15s ease;
      font-family:'Schoulschrëft', system-ui, Arial, sans-serif;
      box-shadow:0 6px 16px rgba(0,0,0,.06);
    }
    .chip.circle{
      aspect-ratio:1/1;
      border-radius:999px;
      width:100%;
      min-width:48px;
      min-height:48px;
      font-size: clamp(18px, 2.8vw, 28px);
    }
    .chip.pill{
      border-radius:999px;
      padding:14px 10px;
      font-size: clamp(18px, 2.6vw, 26px);
    }
    .chip:hover{ background:#fff; transform:translateY(-1px); }
    .chip.correct{ background:var(--ok); color:#fff; border-color:var(--ok); }
    .chip.wrong{ background:var(--bad); color:#fff; border-color:var(--bad); animation:shake .18s linear 2; }
    @keyframes shake {
      0%{transform:translateX(0)} 25%{transform:translateX(-3px)} 50%{transform:translateX(3px)} 75%{transform:translateX(-2px)} 100%{transform:translateX(0)}
    }

    .footer{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-top:16px;
      flex-wrap:wrap;
      color:rgba(0,0,0,.55);
      font-size:clamp(.95rem,2vw,1.05rem);
    }
    .progress{
      height:10px;
      background:rgba(255,255,255,.85);
      border-radius:999px;
      overflow:hidden;
      margin-top:4px;
      border:var(--border) solid rgba(0,0,0,.12);
      box-shadow:0 6px 14px rgba(0,0,0,.06);
    }
    .progress > i{
      display:block;
      height:100%;
      width:0%;
      background: linear-gradient(90deg, rgba(111,175,230,.35), rgba(77,144,205,1));
      transition: width .35s ease;
    }

    .done{ text-align:center; padding:24px 12px 8px; }
    .done h2{ margin:0 0 10px; font-size: clamp(26px, 4vw, 38px); color:var(--accent-ink); }

    /* Game 2 circle */
    .big-circle{
      margin: 24px auto 0;
      width:min(60vmin, 420px);
      aspect-ratio:1/1;
      border-radius:999px;
      border:var(--border) solid rgba(0,0,0,.22);
      background:rgba(255,255,255,.92);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: clamp(36px, 9vmin, 86px);
      font-weight:900;
      cursor:pointer;
      user-select:none;
      transition: transform .2s ease;
      box-shadow:var(--shadow);
      font-family:'Schoulschrëft', system-ui, Arial, sans-serif;
    }
    .pop{ animation: pop .25s ease; }
    @keyframes pop{ 0%{transform: scale(.85)} 70%{transform: scale(1.06)} 100%{transform: scale(1)} }

    /* Game 3 (order the letters) */
    .type-wrap{ display:grid; grid-template-columns: 1fr 2fr; gap:18px; align-items:start; }
    .target{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
    .letter-boxes{ display:flex; gap:8px; flex-wrap:wrap; min-height:58px; }
    .box{
      width:48px; height:56px;
      border:var(--border) solid rgba(0,0,0,.22);
      background:rgba(255,255,255,.92);
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:28px;
      font-weight:900;
      font-family:'Schoulschrëft', system-ui, Arial, sans-serif;
      cursor:pointer;
      box-shadow:0 6px 16px rgba(0,0,0,.06);
    }
    .box.correct{ background:#e9f7ee; border-color:var(--ok); color:var(--ok); }
    .box.wrong{ background:#fdeaea; border-color:var(--bad); color:var(--bad); }

    .bank{ margin-top:10px; display:flex; flex-wrap:wrap; gap:8px; }
    .tile{
      border:var(--border) solid rgba(0,0,0,.22);
      border-radius:10px;
      background:rgba(255,255,255,.92);
      padding:10px 14px;
      min-width:38px;
      text-align:center;
      font-weight:900;
      cursor:pointer;
      user-select:none;
      font-size:22px;
      font-family:'Schoulschrëft', system-ui, Arial, sans-serif;
      box-shadow:0 6px 16px rgba(0,0,0,.06);
    }
    .tile:hover{ background:#fff; }
    .tile.disabled{ opacity:.35; pointer-events:none; }

    .mini-controls{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
    .mini-btn{
      border:var(--border) solid rgba(0,0,0,.22);
      border-radius:12px;
      background:rgba(255,255,255,.92);
      padding:10px 14px;
      cursor:pointer;
      font-weight:900;
      font-family:'Schoulschrëft', system-ui, Arial, sans-serif;
      box-shadow:0 6px 16px rgba(0,0,0,.06);
    }
    .mini-btn:hover{ background:#fff; }

    @media (max-width:820px){
      .type-wrap{ grid-template-columns: 1fr; }
      .nav-wrap{ grid-template-columns: 54px 1fr 54px; }
    }
  </style>
</head>

<body>

  <!-- TOP BAR (no play/replay; just badge + reset) -->
  <div class="topbar">
    <div class="badge" id="countBadge">Beispill 1 / 25</div>
    <div style="display:flex; gap:8px; justify-self:end;">
      <button class="btn" id="resetBtn">Zerécksetzen</button>
    </div>
  </div>

  <div class="app">
    <!-- Center navigation -->
    <div class="card">
      <div class="nav-wrap" role="tablist" aria-label="Spiller wielen">
        <button class="nav-arrow" id="prevArrow" title="Viregt" aria-label="Viregt">
          <img src="https://i.postimg.cc/QBYTSN08/p3arrow.png" alt="">
        </button>

        <div class="nav">
          <div class="tab active" data-screen="game1" role="tab" aria-selected="true">1. Spill</div>
          <div class="tab" data-screen="game2" role="tab" aria-selected="false">2. Spill</div>
          <div class="tab" data-screen="game3" role="tab" aria-selected="false">3. Spill</div>
        </div>

        <button class="nav-arrow" id="nextArrow" title="Nächst" aria-label="Nächst">
          <img src="https://i.postimg.cc/QBYTSN08/p3arrow.png" alt="">
        </button>
      </div>
    </div>

    <!-- GAME 1 -->
    <section id="game1" class="screen active" aria-label="Spill 1">
      <div class="card">
        <div class="word" id="word">—</div>

        <div class="row">
          <div class="label">Unitéiten</div>
          <div class="choices units" id="units"></div>
        </div>

        <div class="row">
          <div class="label">Zéngere</div>
          <div class="choices tens" id="tens"></div>
        </div>

        <div class="footer">
          <div style="min-width:220px; flex:1;">
            <div class="progress" aria-hidden="true"><i id="bar"></i></div>
          </div>
          <div>Punkten: <b id="score">0</b></div>
        </div>

        <div id="endScreen" class="done" style="display:none;">
          <h2>Super gemaach! 🎉</h2>
          <p>Du hues all 25 Beispiller gemaach.</p>
          <p>Punkten: <b id="finalScore">0</b> / 25</p>
          <button class="btn" id="againBtn">Nach eng Kéier spillen</button>
        </div>
      </div>
    </section>

    <!-- GAME 2 -->
    <section id="game2" class="screen" aria-label="Spill 2">
      <div class="card">
        <div class="word">Klick op de Krees fir déi nächst Zuel</div>
        <div class="big-circle" id="sayCircle" title="Klick fir déi nächst Zuel">—</div>
        <div class="footer">
          <div style="min-width:220px; flex:1;">
            <div class="progress"><i id="bar2"></i></div>
          </div>
          <div>Beispill: <b id="count2">0</b></div>
        </div>
      </div>
    </section>

    <!-- GAME 3 -->
    <section id="game3" class="screen" aria-label="Spill 3">
      <div class="card">
        <div class="type-wrap">
          <div class="target">
            <div class="big-circle" id="spellCircle" style="width:min(40vmin, 320px); font-size:clamp(32px,7.2vmin,68px);">—</div>
          </div>
          <div>
            <div class="letter-boxes" id="letterBoxes"></div>
            <div class="bank" id="letterBank"></div>
            <div class="mini-controls">
              <button class="mini-btn" id="undoBtn">Zréck</button>
              <button class="mini-btn" id="clearBtn">Alles läschen</button>
            </div>
            <div class="footer" style="margin-top:14px;">
              <div style="min-width:220px; flex:1;">
                <div class="progress"><i id="bar3"></i></div>
              </div>
              <div>Ronn: <b id="count3">0</b></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    // ---------- DATA ----------
    const NUMBER_WORDS = {
      20:"zwanzeg", 21:"eenanzwanzeg", 22:"zweeanzwanzeg", 23:"dräiandzwanzeg", 24:"véieranzwanzeg", 25:"fënnefanzwanzeg", 26:"sechsanzwanzeg", 27:"siwenanzwanzeg", 28:"achtanzwanzeg", 29:"nénganzwanzeg",
      30:"drësseg", 31:"eenandrësseg", 32:"zweeandrësseg", 33:"dräiandrësseg", 34:"véierandrësseg", 35:"fënnefandrësseg", 36:"sechsadrësseg", 37:"siwenadrësseg", 38:"achtadrësseg", 39:"néngandrësseg",
      40:"véierzeg", 41:"eenavéierzeg", 42:"zweeavéierzeg", 43:"dräiavéierzeg", 44:"véieravéierzeg", 45:"fënnefavéierzeg", 46:"sechsavéierzeg", 47:"siwenavéierzeg", 48:"achtavéierzeg", 49:"néngavéierzeg",
      50:"fofzeg", 51:"eenafofzeg", 52:"zweeafofzeg", 53:"dräiafofzeg", 54:"véierafofzeg", 55:"fënnefafofzeg", 56:"sechsafofzeg", 57:"siwenafofzeg", 58:"achtafofzeg", 59:"néngafofzeg",
      60:"siechzeg", 61:"eenasiechzeg", 62:"zweeasiechzeg", 63:"dräiasiechzeg", 64:"véierasiechzeg", 65:"fënnefasiechzeg", 66:"sechsasiechzeg", 67:"siwenasiechzeg", 68:"achtasiechzeg", 69:"néngasiechzeg",
      70:"siwwenzeg", 71:"eenasiwwenzeg", 72:"zweeasiwwenzeg", 73:"dräiasiwwenzeg", 74:"véierasiwwenzeg", 75:"fënnefasiwwenzeg", 76:"sechsasiwwenzeg", 77:"siwenasiwwenzeg", 78:"achtasiwwenzeg", 79:"néngasiwwenzeg",
      80:"achtzeg", 81:"eenenachtzeg", 82:"zweeanachtzeg", 83:"dräianachtzeg", 84:"véieranachtzeg", 85:"fënnefanachtzeg", 86:"sechsanachtzeg", 87:"siwenanachtzeg", 88:"achtanachtzeg", 89:"nénganachtzeg",
      90:"nonzeg", 91:"eenanonzeg", 92:"zweeanonzeg", 93:"dräianonzeg", 94:"véieranonzeg", 95:"fënnefanonzeg", 96:"sechsanonzeg", 97:"siwenanonzeg", 98:"achtanonzeg", 99:"nénganonzeg",
      100:"honnert"
    };

    // Game 1 deck
    const EXAMPLES = [
      { word: "néngasiechzeg", unit: 9, tens: 60 },
      { word: "dräiandrësseg", unit: 3, tens: 30 },
      { word: "véieravéierzeg", unit: 4, tens: 40 },
      { word: "fënneffofzeg", unit: 5, tens: 50 },
      { word: "siwenasiwwenzeg", unit: 7, tens: 70 },
      { word: "achtanachtzeg", unit: 8, tens: 80 },
      { word: "eenanzwanzeg", unit: 1, tens: 20 },
      { word: "zweeanzwanzeg", unit: 2, tens: 20 },
      { word: "sechsasiechzeg", unit: 6, tens: 60 },
      { word: "nénganonzeg", unit: 9, tens: 90 },
      { word: "zwanzeg", unit: 0, tens: 20 },
      { word: "dräianachtzeg", unit: 3, tens: 80 },
      { word: "véieranonzeg", unit: 4, tens: 90 },
      { word: "fënnefasiwwenzeg", unit: 5, tens: 70 },
      { word: "sechsadrësseg", unit: 6, tens: 30 },
      { word: "siwenavéierzeg", unit: 7, tens: 40 },
      { word: "achtanzwanzeg", unit: 8, tens: 20 },
      { word: "zweeanonzeg", unit: 2, tens: 90 },
      { word: "eenasiechzeg", unit: 1, tens: 60 },
      { word: "véieranfofzeg", unit: 4, tens: 50 },
      { word: "dräiasiwwenzeg", unit: 3, tens: 70 },
      { word: "sechsanonzeg", unit: 6, tens: 90 },
      { word: "achtavéierzeg", unit: 8, tens: 40 },
      { word: "siwenanzwanzeg", unit: 7, tens: 20 },
      { word: "fënnefanachtzeg", unit: 5, tens: 80 },
    ];
    const TOTAL = 25;

    // ---------- NAV ----------
    const tabs = document.querySelectorAll('.tab');
    const screens = document.querySelectorAll('.screen');
    const prevArrow = document.getElementById('prevArrow');
    const nextArrow = document.getElementById('nextArrow');

    function activate(screenId){
      tabs.forEach(t=>t.classList.remove('active'));
      screens.forEach(s=>s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      document.querySelector(`.tab[data-screen="${screenId}"]`).classList.add('active');
    }
    tabs.forEach(tab=> tab.addEventListener('click', ()=> activate(tab.dataset.screen)));

    function currentIndex(){
      const active = Array.from(screens).findIndex(s=>s.classList.contains('active'));
      return active === -1 ? 0 : active;
    }
    prevArrow.addEventListener('click', ()=>{
      const ids = ['game1','game2','game3'];
      const i = currentIndex();
      const ni = (i + 3 - 1) % 3;
      activate(ids[ni]);
    });
    nextArrow.addEventListener('click', ()=>{
      const ids = ['game1','game2','game3'];
      const i = currentIndex();
      const ni = (i + 1) % 3;
      activate(ids[ni]);
    });

    // ---------- HELPERS ----------
    function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }
    function stripSpacesHyphens(s){ return s.replace(/[\s\-]/g,''); }
    function nfc(s){ return s.normalize('NFC'); }

    const TENS_ROOTS = ["zwanzeg","drësseg","véierzeg","fofzeg","siechzeg","siwwenzeg","achtzeg","nonzeg"];

    function highlightLinkingA(word) {
      for (const root of TENS_ROOTS) {
        const i = word.indexOf(root);
        if (i > 0) {
          const two = word.slice(i - 2, i);
          const one = word.slice(i - 1, i);
          if (two === "an") {
            return word.slice(0, i - 2) + "<span class='red'>an</span>" + word.slice(i);
          }
          if (one === "a") {
            return word.slice(0, i - 1) + "<span class='red'>a</span>" + word.slice(i);
          }
        }
      }
      return word;
    }

    // ---------- GAME 1 ----------
    const wordEl   = document.getElementById('word');
    const unitsEl  = document.getElementById('units');
    const tensEl   = document.getElementById('tens');
    const barEl    = document.getElementById('bar');
    const scoreEl  = document.getElementById('score');
    const countBadge = document.getElementById('countBadge');
    const endScreen  = document.getElementById('endScreen');
    const finalScore = document.getElementById('finalScore');
    const resetBtn   = document.getElementById('resetBtn');
    const againBtn   = document.getElementById('againBtn');

    let deck = [], idx = 0, score = 0;
    let lockedUnit = false, lockedTens = false;

    function makeDeck(){ const pool=[...EXAMPLES]; shuffle(pool); return pool.slice(0,TOTAL); }

    function renderNumberRows(){
      unitsEl.innerHTML = '';
      for(let u=0; u<=9; u++){
        const btn = document.createElement('button');
        btn.className = 'chip circle';
        btn.textContent = String(u);
        btn.dataset.unit = u;
        btn.addEventListener('click', onUnitClick);
        unitsEl.appendChild(btn);
      }
      tensEl.innerHTML = '';
      for(let t=10; t<=90; t+=10){
        const btn = document.createElement('button');
        btn.className = 'chip pill';
        btn.textContent = String(t);
        btn.dataset.tens = t;
        btn.addEventListener('click', onTensClick);
        tensEl.appendChild(btn);
      }
    }

    function updateHUD(){
      countBadge.textContent = `Beispill ${Math.min(idx+1, TOTAL)} / ${TOTAL}`;
      scoreEl.textContent = String(score);
      barEl.style.width = Math.round((idx / TOTAL) * 100) + '%';
    }

    function showCard(){
      lockedUnit = lockedTens = false;
      [...unitsEl.children].forEach(el=>el.className='chip circle');
      [...tensEl.children].forEach(el=>el.className='chip pill');
      const card = deck[idx];
      wordEl.innerHTML = highlightLinkingA(card.word);
      updateHUD();
    }

    function flash(el, cls){ el.classList.add(cls); setTimeout(()=>el.classList.remove(cls), 250); }

    function onUnitClick(e){
      if (idx >= TOTAL || lockedUnit) return;
      const el = e.currentTarget;
      const choice = Number(el.dataset.unit);
      const correct = deck[idx].unit;
      if (choice === correct){ el.classList.add('correct'); lockedUnit = true; maybeAdvance(); }
      else { flash(el,'wrong'); }
    }
    function onTensClick(e){
      if (idx >= TOTAL || lockedTens) return;
      const el = e.currentTarget;
      const choice = Number(el.dataset.tens);
      const correct = deck[idx].tens;
      if (choice === correct){ el.classList.add('correct'); lockedTens = true; maybeAdvance(); }
      else { flash(el,'wrong'); }
    }
    function maybeAdvance(){
      if (lockedUnit && lockedTens){
        score += 1;
        updateHUD();
        setTimeout(()=>{
          idx += 1;
          if (idx >= TOTAL) finish(); else showCard();
        }, 420);
      }
    }
    function finish(){
      wordEl.textContent = "—";
      endScreen.style.display = "block";
      finalScore.textContent = String(score);
      barEl.style.width = '100%';
      countBadge.textContent = `Fäerdeg / ${TOTAL}`;
    }
    function resetGame1(){
      endScreen.style.display = "none";
      score = 0; idx = 0; deck = makeDeck();
      showCard();
    }

    // ---------- GAME 2 ----------
    const sayCircle = document.getElementById('sayCircle');
    const bar2 = document.getElementById('bar2');
    const count2 = document.getElementById('count2');
    let list2 = [], i2 = 0;

    function makeList2(){
      const nums = [];
      for(let n=20;n<=100;n++) nums.push(n);
      return shuffle(nums).slice(0,30);
    }
    function show2(){
      sayCircle.textContent = list2[i2] ?? '—';
      sayCircle.classList.remove('pop'); void sayCircle.offsetWidth; sayCircle.classList.add('pop');
      bar2.style.width = Math.round((i2 / list2.length) * 100) + '%';
      count2.textContent = String(i2);
    }
    function next2(){
      i2++;
      if (i2 >= list2.length){ i2 = 0; list2 = makeList2(); }
      show2();
    }
    function resetGame2(){ list2 = makeList2(); i2 = 0; show2(); }
    sayCircle.addEventListener('click', next2);

    // ---------- GAME 3 ----------
    const spellCircle = document.getElementById('spellCircle');
    const letterBoxes = document.getElementById('letterBoxes');
    const letterBank = document.getElementById('letterBank');
    const bar3 = document.getElementById('bar3');
    const count3 = document.getElementById('count3');
    const undoBtn = document.getElementById('undoBtn');
    const clearBtn = document.getElementById('clearBtn');

    let list3 = [], i3 = 0, targetWord = '', targetLetters = [], filled = [];

    function makeList3(){
      const pool = [];
      for (let n=20;n<=100;n++){
        if (NUMBER_WORDS[n]) pool.push(n);
      }
      return shuffle(pool).slice(0,20);
    }

    function newRound3(){
      filled = [];
      const num = list3[i3];
      spellCircle.textContent = String(num);

      const raw = NUMBER_WORDS[num] || '';
      targetWord = nfc(stripSpacesHyphens(raw));
      targetLetters = [...targetWord];

      letterBoxes.innerHTML = '';
      targetLetters.forEach(()=>{
        const b = document.createElement('div');
        b.className = 'box';
        b.textContent = '';
        b.addEventListener('click', ()=> removeLast());
        letterBoxes.appendChild(b);
      });

      letterBank.innerHTML = '';
      const bankLetters = shuffle([...targetLetters]);
      bankLetters.forEach((ch, idx)=>{
        const t = document.createElement('div');
        t.className = 'tile';
        t.textContent = ch;
        t.dataset.index = idx;
        t.addEventListener('click', ()=> pickTile(t));
        letterBank.appendChild(t);
      });

      updateBars3();
    }

    function updateBars3(){
      bar3.style.width = Math.round((i3 / list3.length) * 100) + '%';
      count3.textContent = String(i3);
    }

    function pickTile(tile){
      const boxes = [...letterBoxes.children];
      const emptyIndex = boxes.findIndex(b=> b.textContent === '');
      if (emptyIndex === -1) return;

      boxes[emptyIndex].textContent = tile.textContent;
      tile.classList.add('disabled');
      filled.push(tile);

      if (boxes.every(b=> b.textContent !== '')){
        checkWord3();
      }
    }

    function removeLast(){
      if (filled.length === 0) return;
      const boxes = [...letterBoxes.children];
      let lastFilled = boxes.length - 1;
      while (lastFilled >= 0 && boxes[lastFilled].textContent === '') lastFilled--;
      if (lastFilled < 0) return;

      boxes[lastFilled].textContent = '';
      const lastTile = filled.pop();
      lastTile.classList.remove('disabled');
    }

    function clearAll(){
      const boxes = [...letterBoxes.children];
      boxes.forEach(b=> b.textContent = '');
      const tiles = [...letterBank.children];
      tiles.forEach(t=> t.classList.remove('disabled'));
      filled = [];
    }

    function markBoxes(cls){
      const boxes = [...letterBoxes.children];
      boxes.forEach(b=> b.classList.add(cls));
      setTimeout(()=> boxes.forEach(b=> b.classList.remove(cls)), 450);
    }

    function checkWord3(){
      const guess = nfc([...letterBoxes.children].map(b=>b.textContent).join(''));
      if (guess === targetWord){
        markBoxes('correct');
        setTimeout(()=>{
          i3++;
          if (i3 >= list3.length){ list3 = makeList3(); i3 = 0; }
          newRound3();
        }, 500);
      } else {
        markBoxes('wrong');
        setTimeout(clearAll, 450);
      }
    }

    undoBtn.addEventListener('click', removeLast);
    clearBtn.addEventListener('click', clearAll);

    function resetGame3(){ list3 = makeList3(); i3 = 0; newRound3(); }

    // ---------- GLOBAL CONTROLS ----------
    resetBtn.addEventListener('click', ()=>{ resetGame1(); resetGame2(); resetGame3(); });
    againBtn?.addEventListener('click', resetGame1);

    // Init all
    renderNumberRows();
    resetGame1();
    resetGame2();
    resetGame3();
  </script>
</body>
</html>
